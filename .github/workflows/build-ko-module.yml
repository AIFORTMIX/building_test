name: 编译自定义 KO 模块

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "自定义模块源码路径：单个 .c 文件或包含 Kbuild/Makefile 的目录"
        required: true
        type: string
        default: "driver"
      module_name:
        description: "模块名，不带 .ko 后缀；单 .c 会被复制为 <module_name>.c"
        required: true
        type: string
        default: "qingwei_mcp"
      android_version:
        description: "Android 版本"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
        default: android14
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "6.1"
      sub_level:
        description: "子版本号；批量模式下会从 data/ 自动读取"
        required: true
        type: string
        default: "138"
      os_patch_level:
        description: "安全补丁级别，如 2025-07；批量模式下会从 data/ 自动读取"
        required: true
        type: string
        default: "2025-06"
      build_all_known:
        description: "是否读取 data/<android>/<kernel>.json 批量编译该 Android/KMI 的全部已知版本"
        required: false
        type: boolean
        default: false
      include_lts:
        description: "批量模式下是否包含 LTS 分支"
        required: false
        type: boolean
        default: false
      kernel_localversion:
        description: "可选：追加到 UTS_RELEASE 的 localversion 后缀，用于匹配目标设备 uname -r"
        required: false
        type: string
        default: ""
      extra_cflags:
        description: "可选：追加给外部模块的 ccflags-y"
        required: false
        type: string
        default: ""
      bazel_lto:
        description: "构建使用的 LTO 模式；需与目标内核核对"
        required: false
        type: choice
        options:
          - none
          - thin
        default: thin

      kernel_commit:
        description: "固定 common 源码 commit；批量通用构建时留空"
        required: false
        type: string
        default: "5929004f86ffc02c0b750715ec5a2b1541d14065"
      target_symvers:
        description: "目标 CRC 参考文件；批量通用构建时留空，不用于改写模块"
        required: false
        type: string
        default: "build-inputs/android14-6.1.138/Module.symvers"
      expected_kernel_release:
        description: "校验完整 kernel release；批量通用构建时留空"
        required: false
        type: string
        default: "6.1.138-android14-11-g5929004f86ffc-ab10023717-4k"

jobs:
  test-build-tools:
    name: 校验构建与 ABI 检查工具
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行构建边界回归
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null || ! command -v make >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang make
          fi
          command -v clang
          command -v make
          python3 -m unittest discover -s tests/build -v

  generate-matrix:
    name: 生成构建矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成矩阵
        id: matrix
        shell: bash
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          SUB_LEVEL: ${{ inputs.sub_level }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          BUILD_ALL_KNOWN: ${{ inputs.build_all_known }}
          INCLUDE_LTS: ${{ inputs.include_lts }}
          TARGET_SYMVERS: ${{ inputs.target_symvers }}
          EXPECTED_RELEASE: ${{ inputs.expected_kernel_release }}
          KERNEL_COMMIT: ${{ inputs.kernel_commit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          android_version = os.environ["ANDROID_VERSION"]
          kernel_version = os.environ["KERNEL_VERSION"]
          sub_level = os.environ["SUB_LEVEL"].strip()
          os_patch_level = os.environ["OS_PATCH_LEVEL"].strip()
          build_all = os.environ["BUILD_ALL_KNOWN"].lower() == "true"
          include_lts = os.environ["INCLUDE_LTS"].lower() == "true"

          supported = {
              ("android12", "5.10"),
              ("android13", "5.15"),
              ("android14", "6.1"),
              ("android15", "6.6"),
              ("android16", "6.12"),
          }
          if (android_version, kernel_version) not in supported:
              raise SystemExit(
                  f"不支持的 Android/内核组合: {android_version}/{kernel_version}; "
                  "支持 android12/5.10, android13/5.15, android14/6.1, android15/6.6, android16/6.12"
              )

          include = []
          seen = set()

          if build_all and any(os.environ.get(k) for k in ("TARGET_SYMVERS", "EXPECTED_RELEASE", "KERNEL_COMMIT")):
              raise SystemExit("批量通用构建需要清空 target_symvers、expected_kernel_release、kernel_commit")
          normal_version = re.fullmatch(r"[0-9]+", sub_level) and re.fullmatch(r"[0-9]{4}-(0[1-9]|1[0-2])", os_patch_level)
          if not build_all and not (normal_version or (sub_level == "X" and os_patch_level == "lts")):
              raise SystemExit("单版本模式需要数字子版本 / YYYY-MM，或 X / lts")
          if os.environ.get("KERNEL_COMMIT") and not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ["KERNEL_COMMIT"]):
              raise SystemExit("kernel_commit 必须是完整 40 位 commit")
          if build_all:
              data_path = Path("data") / android_version / f"{kernel_version}.json"
              if not data_path.exists():
                  raise SystemExit(f"未找到版本配置: {data_path}")
              data = json.loads(data_path.read_text(encoding="utf-8"))
              for entry in data.get("entries", []):
                  kernel = str(entry.get("kernel", ""))
                  date = str(entry.get("date", "")).strip()
                  if not kernel or not date:
                      continue
                  actual_sub = kernel.rsplit(".", 1)[-1]
                  if not (kernel.startswith(kernel_version + ".") and re.fullmatch(r"[0-9]+", actual_sub)
                          and re.fullmatch(r"[0-9]{4}-(0[1-9]|1[0-2])", date)):
                      raise SystemExit(f"非法版本目录条目: {kernel} / {date}")
                  key = (actual_sub, date)
                  if key in seen:
                      continue
                  seen.add(key)
                  include.append({
                      "android_version": android_version,
                      "kernel_version": kernel_version,
                      "sub_level": actual_sub,
                      "os_patch_level": date,
                  })
              if include_lts and data.get("lts"):
                  include.append({
                      "android_version": android_version,
                      "kernel_version": kernel_version,
                      "sub_level": "X",
                      "os_patch_level": "lts",
                  })
          else:
              if not sub_level or not os_patch_level:
                  raise SystemExit("单版本模式必须提供 sub_level 和 os_patch_level")
              include.append({
                  "android_version": android_version,
                  "kernel_version": kernel_version,
                  "sub_level": sub_level,
                  "os_patch_level": os_patch_level,
              })

          if not include:
              raise SystemExit("构建矩阵为空")

          matrix = {"include": include}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")

          print(json.dumps(matrix, indent=2, ensure_ascii=False))
          PY

  build-ko:
    name: "${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }}"
    needs: [generate-matrix, test-build-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      ABK_KO_SOURCE_PATH: ${{ inputs.source_path }}
      ABK_KO_MODULE_NAME: ${{ inputs.module_name }}
      ABK_KO_KERNEL_LOCALVERSION: ${{ inputs.kernel_localversion }}
      ABK_KO_EXTRA_CFLAGS: ${{ inputs.extra_cflags }}
      ABK_KO_LTO: ${{ inputs.bazel_lto }}
      ABK_KO_TARGET_SYMVERS: ${{ inputs.target_symvers }}
      ABK_KO_EXPECTED_RELEASE: ${{ inputs.expected_kernel_release }}
      ABK_KO_KERNEL_COMMIT: ${{ inputs.kernel_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 构建信息摘要
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### 自定义 KO 模块构建"
            echo
            echo "- Source: \`${ABK_KO_SOURCE_PATH}\`"
            echo "- Module: \`${ABK_KO_MODULE_NAME}.ko\`"
            echo "- Target: \`${{ matrix.android_version }}/${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}\`"
            echo "- localversion: \`${ABK_KO_KERNEL_LOCALVERSION:-默认}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 校验输入文件
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e "$ABK_KO_SOURCE_PATH" ]; then
            echo "::error::源码路径不存在: $ABK_KO_SOURCE_PATH"
            exit 1
          fi
          if ! [[ "$ABK_KO_MODULE_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::module_name 必须是合法 C/Kbuild 标识符: $ABK_KO_MODULE_NAME"
            exit 1
          fi

      - name: 初始化构建环境
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.sub_level }}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"
          {
            echo "CONFIG=$CONFIG"
            echo "KERNEL_ROOT=$KERNEL_ROOT"
            echo "DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig"
            echo "REPO=$GITHUB_WORKSPACE/git-repo/repo"
          } >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L "https://storage.googleapis.com/git-repo-downloads/repo" -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

      - name: 安装编译依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves kmod bc

      - name: 检查构建资源并按可用空间配置 swap
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          available_kb=$(df --output=avail -k "$RUNNER_TEMP" | tail -1 | tr -d ' ')
          swap_gb=$(( (available_kb - 20 * 1024 * 1024) / 1024 / 1024 ))
          if (( swap_gb > 8 )); then swap_gb=8; fi
          if (( swap_gb >= 2 )); then
            swap_file="$RUNNER_TEMP/qingwei-build.swap"
            sudo fallocate -l "${swap_gb}G" "$swap_file"
            sudo chmod 600 "$swap_file"
            sudo mkswap "$swap_file"
            sudo swapon "$swap_file"
          else
            echo "::warning::磁盘空间不足以在保留 20 GiB 构建空间后增加 swap；不会强制分配或删除预装目录"
          fi
          free -h

      - name: 配置 ccache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ko-${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ko-${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.sub_level }}-ccache-

      - name: 缓存工具链
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            kernel-build-tools
          key: ko-toolchain-${{ runner.os }}-v1

      - name: 下载工具链
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://android.googlesource.com/kernel/prebuilts/build-tools" -b main-kernel-build-2024 --depth 1 kernel-build-tools

      - name: 初始化并同步内核源码
        working-directory: ${{ env.KERNEL_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git" gcc

          FORMATTED_BRANCH="${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.os_patch_level }}"
          echo "初始化 repo，分支: common-${FORMATTED_BRANCH}"

          "$REPO" init --depth=1 -u "https://android.googlesource.com/kernel/manifest" -b "common-${FORMATTED_BRANCH}" --repo-rev=v2.16

          REMOTE_BRANCH="$(git ls-remote "https://android.googlesource.com/kernel/common" "${FORMATTED_BRANCH}" || true)"
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            echo "检测到已弃用的分支: $FORMATTED_BRANCH"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" "$DEFAULT_MANIFEST_PATH"
          fi

          "$REPO" --trace sync -c -j"$(nproc --all)" --no-tags --fail-fast
          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> "$GITHUB_ENV"

          if [[ -n "$ABK_KO_KERNEL_COMMIT" ]]; then
            git -C common fetch --depth=1 origin "$ABK_KO_KERNEL_COMMIT"
            git -C common checkout --detach "$ABK_KO_KERNEL_COMMIT"
          fi
          actual_version=$(awk '/^VERSION =/{v=$3} /^PATCHLEVEL =/{p=$3} /^SUBLEVEL =/{s=$3} END{printf "%s.%s.%s",v,p,s}' common/Makefile)
          if [[ "${{ matrix.sub_level }}" != X && "$actual_version" != "${{ matrix.kernel_version }}.${{ matrix.sub_level }}" ]]; then
            echo "::error::源码版本 $actual_version 与请求的版本不一致"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/ko-provenance/$CONFIG"
          "$REPO" manifest -r -o "$GITHUB_WORKSPACE/ko-provenance/$CONFIG/resolved-manifest.xml"

      - name: 可选匹配目标 uname -r 后缀
        if: ${{ inputs.kernel_localversion != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # 不要修改 common/arch/arm64/configs/gki_defconfig。
          # Android Kleaf 会执行 savedefconfig 校验，直接写 CONFIG_LOCALVERSION 会导致：
          #   ERROR: savedefconfig does not match common/arch/arm64/configs/gki_defconfig
          #
          # Kbuild 会自动读取源码树根目录下的 localversion* 文件并追加到 UTS_RELEASE。
          # 这里用 localversion-abk-ko 追加目标设备 uname -r 后缀，尽量让 .ko vermagic 匹配设备内核。
          normalized_localversion="$ABK_KO_KERNEL_LOCALVERSION"
          duplicated_prefix="-${{ matrix.android_version }}-11-"
          if [[ "$normalized_localversion" == "$duplicated_prefix"* ]]; then
            normalized_localversion="-${normalized_localversion#"$duplicated_prefix"}"
            echo "检测到 localversion 已包含 $duplicated_prefix，已自动去重为: $normalized_localversion"
          fi
          if [ "${#normalized_localversion}" -gt 48 ]; then
            echo "::warning::localversion 仍然较长，可能导致 UTS_RELEASE 超过 Linux 内核 64 字符限制: $normalized_localversion"
          fi
          printf '%s\n' "$normalized_localversion" > "$KERNEL_ROOT/common/localversion-abk-ko"
          echo "已写入 localversion 文件: $KERNEL_ROOT/common/localversion-abk-ko"
          cat "$KERNEL_ROOT/common/localversion-abk-ko"

      # 保留真实 BTF/工具链行为。工具失败时让构建失败并保留日志，
      # 不生成占位 BTF，也不通过静默改变配置掩盖错误。

      - name: 编译自定义 KO 模块
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_external_ko.sh
          out_dir="$GITHUB_WORKSPACE/ko-output/${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
          scripts/build_external_ko.sh \
            --kernel-root "$KERNEL_ROOT" \
            --source "$ABK_KO_SOURCE_PATH" \
            --module-name "$ABK_KO_MODULE_NAME" \
            --output-dir "$out_dir"
          cp "$GITHUB_WORKSPACE/ko-provenance/$CONFIG/resolved-manifest.xml" "$out_dir/"
          git -C "$KERNEL_ROOT/common" status --short > "$out_dir/kernel-git-status.txt"
          git -C "$KERNEL_ROOT/common" diff --binary > "$out_dir/kernel-source.patch"
          echo "ABK_KO_OUTPUT_DIR=$out_dir" >> "$GITHUB_ENV"

      - name: 写入目标信息
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "android_version=${{ matrix.android_version }}"
            echo "kernel_version=${{ matrix.kernel_version }}"
            echo "sub_level=${{ matrix.sub_level }}"
            echo "os_patch_level=${{ matrix.os_patch_level }}"
            echo "source_path=${ABK_KO_SOURCE_PATH}"
            echo "module_name=${ABK_KO_MODULE_NAME}"
            echo "validation_scope=构建和请求的 release/CRC 检查；完整 ABI、签名、CFI 及真机稳定性仍需验证"
          } >> "$ABK_KO_OUTPUT_DIR/target.txt"

      - name: 上传 KO 模块产物
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.module_name }}-${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
          path: ${{ env.ABK_KO_OUTPUT_DIR }}
          if-no-files-found: error

      - name: 上传失败诊断（不含 KO）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.module_name }}-${{ matrix.android_version }}-${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}-diagnostics"
          path: |
            ko-output/**/build.log
            ko-output/**/abi-report.json
            ko-output/**/source-manifest.json
          if-no-files-found: ignore
