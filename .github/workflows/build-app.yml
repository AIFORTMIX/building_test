name: Build app and test simulated AI-MCP chain

on:
  push:
    branches: [main]
    paths: ['app/**', 'third_party/**', 'tests/analysis/**', 'tests/debugger/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', 'tests/abi/**', '.github/workflows/build-app.yml', 'scripts/run_android_smoke.sh', 'scripts/run_glass_compat.sh', 'scripts/check_compose_alignment.py', 'scripts/check_debugger_packaging.py']
  pull_request:
    paths: ['app/**', 'third_party/**', 'tests/analysis/**', 'tests/debugger/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', 'tests/abi/**', '.github/workflows/build-app.yml', 'scripts/run_android_smoke.sh', 'scripts/run_glass_compat.sh', 'scripts/check_compose_alignment.py', 'scripts/check_debugger_packaging.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '16111833'
      - name: Install pinned SDK and native toolchain
        run: sdkmanager 'platforms;android-37.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable APK signing key
        if: github.event_name != 'pull_request'
        env:
          QINGWEI_SIGNING_KEYSTORE_B64: ${{ secrets.QINGWEI_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$QINGWEI_SIGNING_KEYSTORE_B64" || { echo 'Configure the Qingwei signing Secrets before building installable APKs.'; exit 1; }
          umask 077
          printf '%s' "$QINGWEI_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/qingwei-signing.p12"
      - name: Build APKs and run protocol, Markdown and session regressions
        env:
          QINGWEI_KEYSTORE_PATH: ${{ github.event_name != 'pull_request' && format('{0}/qingwei-signing.p12', runner.temp) || '' }}
          QINGWEI_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.QINGWEI_STORE_PASSWORD || '' }}
          QINGWEI_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.QINGWEI_KEY_ALIAS || '' }}
          QINGWEI_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.QINGWEI_KEY_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --console=plain -Pqingwei.abis=arm64-v8a,x86_64
          python3 tests/abi/check_abi.py
          python3 scripts/check_compose_alignment.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          python3 scripts/check_debugger_packaging.py app/build/outputs/apk/debug/app-debug.apk "$release_apk"
      - name: Prepare downloadable APKs
        run: |
          mkdir -p app-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk app-artifacts/qingwei-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app-artifacts/qingwei-android-test.apk
          python3 - <<'PY'
          import json, os, re, shutil, subprocess
          from pathlib import Path
          properties = dict(line.strip().split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          expected = (int(properties['kernelai.version.code']), properties['kernelai.version.name'])
          aapt = sorted(Path(os.environ['ANDROID_HOME'], 'build-tools').glob('*/aapt2'))[-1]
          for variant in ('debug', 'release'):
              folder = Path(f'app/build/outputs/apk/{variant}')
              output = json.loads((folder / 'output-metadata.json').read_text())
              if any((item['versionCode'], item['versionName']) != expected for item in output['elements']):
                  raise SystemExit(f'{variant} APK version does not match gradle.properties')
              for item in output['elements']:
                  apk = folder / item['outputFile']
                  if not apk.resolve().is_relative_to(folder.resolve()):
                      raise SystemExit('Unexpected APK path')
                  badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
                  code = re.search(r"versionCode='(\d+)'", badging)
                  name = re.search(r"versionName='([^']*)'", badging)
                  if not code or not name or (int(code[1]), name[1]) != expected:
                      raise SystemExit(f'{variant} packaged manifest has an unexpected version')
          directory = Path('app/build/outputs/apk/release')
          metadata = json.loads((directory / 'output-metadata.json').read_text())
          name = metadata['elements'][0]['outputFile']
          if name not in ('app-release.apk', 'app-release-unsigned.apk'):
              raise SystemExit('Unexpected release output')
          target = 'qingwei.apk' if name == 'app-release.apk' else 'qingwei-release-unsigned.apk'
          shutil.copyfile(directory / name, Path('app-artifacts') / target)
          PY
          (cd app-artifacts && sha256sum *.apk > SHA256SUMS)
      - name: Verify installable release signature
        if: github.event_name != 'pull_request'
        run: |
          test -f app-artifacts/qingwei.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$signer" verify --print-certs app-artifacts/qingwei.apk > app-artifacts/SIGNING.txt
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/qingwei-signing.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: qingwei-apks
          path: app-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qingwei-host-test-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn

  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qingwei-apks
          path: app-artifacts
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual Compose UI and JNI with fixture responses
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/run_android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qingwei-android-smoke-reports
          path: android-smoke-results/
          if-no-files-found: warn

  glass-compat:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [28, 31, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qingwei-apks
          path: app-artifacts
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise fallback and dialog lifecycle on older Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/run_glass_compat.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qingwei-glass-api-${{ matrix.api }}
          path: android-glass-results/
          if-no-files-found: warn
